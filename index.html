<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2efe9" />
    <title>Elio — Desarrollador</title>
    <meta
      name="description"
      content="Portafolio de Elio: apps web con TypeScript y React. Los proyectos se sincronizan directamente desde GitHub."
    />
    <meta property="og:title" content="Elio — Desarrollador" />
    <meta property="og:description" content="Portafolio con proyectos sincronizados desde GitHub." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/icon.svg" />
    <link rel="mask-icon" href="/icon.svg" color="#2f3bff" />
    <script>
      // Aplica el tema antes del primer pintado para que no haya destello.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
